name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Only trusted main pushes use Mikrus; PR code stays on disposable hosts.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "Linux", "X64", "planner"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:web
