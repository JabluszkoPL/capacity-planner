# Publishes a release when a version tag is pushed:
#
#   pnpm version:set 0.2.0
#   git commit -am "Release v0.2.0" && git tag v0.2.0
#   git push && git push --tags
#
# The Mac app checks this repository's latest release and offers to install
# it, so a tag here is what reaches every installed copy. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag matches the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION."
            echo "Run: pnpm version:set $TAG, commit, and tag again."
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:mac

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          gh release create "$GITHUB_REF_NAME" \
            --title "Planner $GITHUB_REF_NAME" \
            --generate-notes \
            Planner-*-universal.dmg \
            Planner-*-universal-mac.zip \
            FOR-TESTERS.md
